<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>DSH Desktop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 640px; text-align: center; padding: 24px; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto 20px;
      border: 3px solid #262b36; border-top-color: #2b6cff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #status { color: #9aa3b2; font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
    button {
      background: #2b6cff; color: #fff; border: 0; border-radius: 6px;
      padding: 8px 20px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #1f5be0; }
    .hint {
      margin-top: 28px; text-align: left; background: #171a21;
      border: 1px solid #262b36; border-radius: 8px; padding: 14px 18px;
      font-size: 13px; color: #9aa3b2; line-height: 1.8;
    }
    .hint p { margin: 0 0 6px; }
    .hint ol { margin: 0; padding-left: 18px; }
    code { background: #262b36; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #cdd6e3; }
    #logs {
      margin-top: 14px; text-align: left; background: #0a0c10; color: #8ea0b8;
      border: 1px solid #262b36; border-radius: 8px; padding: 12px;
      font-size: 11px; max-height: 180px; overflow: auto; white-space: pre-wrap;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>DeepSeek Harness Desktop</h1>
    <p id="status">正在启动…</p>
    <button id="retry" class="hidden">重试启动</button>
    <div class="hint">
      <p>启动失败的常见原因：</p>
      <ol>
        <li>未安装 dsh：执行 <code>npm i -g @deepseek-ai/dsh</code></li>
        <li>dsh 不在 PATH：设置环境变量 <code>DSH_BIN</code> 指向可执行文件</li>
        <li>端口 3080 被占用：设置 <code>DSH_PORT</code> 换端口（需 dsh 支持 <code>--port</code>）</li>
      </ol>
    </div>
    <pre id="logs" class="hidden"></pre>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retry");
    const logsEl = document.getElementById("logs");
    if (window.dsh) {
      window.dsh.onStatus((p) => {
        statusEl.textContent = p.message || p.state;
        if (p.state === "failed") {
          retryBtn.classList.remove("hidden");
          if (p.logs) {
            logsEl.textContent = p.logs;
            logsEl.classList.remove("hidden");
          }
        } else {
          retryBtn.classList.add("hidden");
        }
      });
      retryBtn.addEventListener("click", () => window.dsh.retry());
    }
  </script>
</body>
</html>
