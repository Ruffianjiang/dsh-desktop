[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness desktop shell built on Tauri 2"
authors = ["your-name"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Must stay on the same release line as the JS @tauri-apps/* packages (which
# float to latest 2.x via ^2.0.0). Tauri's CLI aborts the build if the Rust
# crate and the npm package major/minor versions mismatch.
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
