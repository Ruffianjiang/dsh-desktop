# dsh-desktop → .github/dependabot.yml
# v0.4 版（随 feat/v0.4-manager 合入 main 生效）：目录布局按 v0.4 调整——
# tauri-skeleton 已归档至 legacy/，Dart/Flutter 子包（v0.4 新增）启用纳管。
#
# 告警对应（2026-09-04）：open 仅剩 #56 glib（cargo，修复版本 0.20.0；
# 此前一轮 cargo 更新器瞬时失败，路径修正后随调度重试）。
# #48 extract-zip 已关闭；#49–55（vite/esbuild）已由 PR #2/#5 修复。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"                          # 根 package.json + package-lock.json（Electron 壳，归档保留）
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/legacy/tauri-skeleton"     # v0.4 目录迁移：tauri-skeleton → legacy/
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/legacy/tauri-skeleton/src-tauri"  # 承载 #56（glib）
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # —— v0.4 新增的 Dart/Flutter 子包（本 PR 合入后 pubspec 已存在于 main） ——
  - package-ecosystem: "pub"
    directory: "/apps/probe_cli"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "pub"
    directory: "/packages/client_dart"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "pub"
    directory: "/packages/dsh_manager"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10
